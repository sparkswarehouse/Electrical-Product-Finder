<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>TradeFind AI | Electrical Product Finder</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f8fafc;color:#0f172a}.productImage{width:100%;height:180px;object-fit:contain;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:12px;margin-bottom:14px}.thumb{width:52px;height:52px;object-fit:contain;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:4px}.modalHero{width:160px;height:160px;object-fit:contain;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:10px;margin-bottom:14px}</style><script>window.PLACEHOLDER_IMAGES={default:'https://placehold.co/600x600/f8fafc/94a3b8?text=Electrical+Product',Sockets:'https://placehold.co/600x600/f8fafc/2563eb?text=Socket',Switches:'https://placehold.co/600x600/f8fafc/0f172a?text=Switch',Lighting:'https://placehold.co/600x600/f8fafc/f59e0b?text=Lighting','Control Gear':'https://placehold.co/600x600/f8fafc/16a34a?text=Control+Gear'};window.productImage=function(product){return product.image||window.PLACEHOLDER_IMAGES[product.category]||window.PLACEHOLDER_IMAGES.default};</script></head><body><script>document.addEventListener('DOMContentLoaded',()=>{const originalRender=window.render;if(originalRender){window.render=function(){originalRender();document.querySelectorAll('.card').forEach((card,index)=>{if(card.querySelector('.productImage'))return;const p=(window.products||[])[index];if(!p)return;const img=document.createElement('img');img.className='productImage';img.src=window.productImage(p);img.alt=p.name||'Product';card.prepend(img);});};}const originalOpen=window.openProduct;if(originalOpen){window.openProduct=function(i){originalOpen(i);const p=(window.products||[])[i];if(!p)return;const titleWrap=document.querySelector('#productModal h2')?.parentElement;if(titleWrap&&!titleWrap.querySelector('.modalHero')){const img=document.createElement('img');img.className='modalHero';img.src=window.productImage(p);img.alt=p.name||'Product';titleWrap.prepend(img);}document.querySelectorAll('.altTable tbody tr').forEach((row,rowIndex)=>{const first=row.querySelector('td');if(!first||first.querySelector('.thumb'))return;const alt=(window.alternatives&&window.alternatives(p)[rowIndex])||null;if(!alt)return;first.innerHTML=`<div style='display:flex;gap:10px;align-items:center'><img class='thumb' src='${window.productImage(alt)}' alt='${alt.name}'><div>${first.innerHTML}</div></div>`;});};}});</script></body></html>
